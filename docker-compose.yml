services:
  # Your Express App
  express_server:
    build: ./app
    restart: always
    ports:
      - "5000:5000" # Map host 5000 to container 5000
    environment:
      - PORT=5000
    depends_on:
      - redis_db

  # Nginx as the Front Door
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - express_server

  # Redis (Since you have a redis service)
  redis_db:
    image: redis:alpine
    restart: always