<form  (submit)="handleOnSubmit($event)" 

class="mx-auto border flex flex-col gap-5 px-4 py-2 rounded-lg w-80">
    <div class="text-center">
        <span class="text-3xl test-title">{{title()}}</span>
    </div>
    @if(isConfirm()){
    <div class="flex flex-col gap-3">
        <label for="role" class="test-title">Role</label>
        <select 
        class="px-2 py-2 border rounded-lg test-input-select " id="role" 
        [formField]="authForm.role!!">
            <option value="admin">Admin</option>
            <option value="user">User</option>
        </select>
    </div>
    }
    <div class="flex flex-col gap-3">
        <label for="email" class="test-title">Email</label>
        <input type="email" id="email" [formField]="authForm.email" placeholder="Enter Email" 
        class="px-2 py-2 border rounded-lg test-input"/>
    </div>
    @if(emailError()){ 
        <div class="text-red-500">
            Email is required
        </div>
   }
    <div class="flex flex-col gap-3">
        <label for="password" class="test-title">Password</label>
        <input type="password" id="password" [formField]="authForm.password" placeholder="*****" 
        class="px-2 py-2 border rounded-lg test-input"/>
    </div>
    @if(passwordError()){<div class="text-red-500">
           Password is required
    </div>}
    @if(isConfirm()){
         <div class="flex flex-col gap-3">
        <label for="confirm-password " class="text--color-text test-title">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="*****" 
        class="px-2 py-2 border rounded-lg test-input"/>
    </div>
     }
    <div class="flex justify-end">
        <button type="submit" class="bg-blue-500 rounded-lg p-2 text-white test-title " 
        >{{title()}}</button>
    </div>

</form>
