<div class="fixed bottom-4 left-4 z-50 space-y-2 max-w-sm">
      @for (message of messages$(); track message.id; let index = $index) {
        <div 
          class="bg-gradient-to-r from-gray-800 to-gray-900 text-white px-4 py-3 rounded-lg shadow-xl transition-all duration-300 cursor-pointer hover:scale-105"
          [style.transform]="'translateY(' + (index * -50) + 'px)'"
          [style.opacity]="1 - (index * 0.15)"
          [style.zIndex]="messages$().length - index"
          (click)="removeMessage(message.id)"
        >
          <div class="flex items-center gap-3">
            <div class="flex-shrink-0">
              <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
            </div>
            <div class="flex-1">
              <p class="text-sm font-medium">{{ message.text }}</p>
              <p class="text-xs text-gray-400 mt-0.5">{{ getTimeAgo(message.timestamp) }}</p>
            </div>
            <button class="text-gray-400 hover:text-white">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </button>
          </div>
          <!-- Progress bar -->
          <div class="mt-2">
            <div class="w-full bg-gray-700 rounded-full h-1 overflow-hidden">
              <div 
                class="bg-green-400 h-1 rounded-full transition-all duration-100 ease-linear"
                [style.width.%]="message.progressPercentage"
              ></div>
            </div>
          </div>
        </div>
      }
    </div>
