<!-- Top Right - Success/Info Messages -->
    <div class="fixed top-4 right-4 z-50 space-y-2 max-w-sm">
      @for (msg of topRightMessages(); track msg.id) {
        <div class="bg-green-500 text-white px-4 py-3 rounded-lg shadow-lg animate-in fade-in slide-in-from-top-2 flex items-center justify-between gap-3 min-w-[280px]">
          <div class="flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span class="text-sm font-medium">{{ msg.text }}</span>
          </div>
          <button (click)="removeMessage(topRightMessages, msg.id)" class="hover:bg-white/20 rounded p-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      }
    </div>

    <!-- Bottom Right - Warning Messages -->
    <div class="fixed bottom-4 right-4 z-50 space-y-2 max-w-sm">
      @for (msg of bottomRightMessages(); track msg.id) {
        <div class="bg-yellow-500 text-white px-4 py-3 rounded-lg shadow-lg animate-in fade-in slide-in-from-bottom-2 flex items-center justify-between gap-3 min-w-[280px]">
          <div class="flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
            <span class="text-sm font-medium">{{ msg.text }}</span>
          </div>
          <button (click)="removeMessage(bottomRightMessages, msg.id)" class="hover:bg-white/20 rounded p-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      }
    </div>

    <!-- Top Center - Error Messages -->
    <div class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 space-y-2 max-w-md w-full">
      @for (msg of topCenterMessages(); track msg.id) {
        <div class="bg-red-500 text-white px-4 py-3 rounded-lg shadow-lg animate-in fade-in slide-in-from-top-2 flex items-center justify-between gap-3">
          <div class="flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span class="text-sm font-medium">{{ msg.text }}</span>
          </div>
          <button (click)="removeMessage(topCenterMessages, msg.id)" class="hover:bg-white/20 rounded p-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      }
    </div>
