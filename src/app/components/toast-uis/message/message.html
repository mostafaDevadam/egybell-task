@if(message && isMessageVisible) {
<div class="fixed top-4 right-4 z-50 w-96 transform transition-all duration-300 animate-in fade-in slide-in-from-top-2">
    <div [class]="getMessageClasses()">
        <div class="flex items-center gap-3">
            <div class="flex-shrink-0">
                <svg class="w-6 h-6" [class]="getIconClasses()" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    @if(message.type === 'success') {
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    } @else if(message.type === 'error') {
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    } @else {
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    }
                </svg>
            </div>
            <div class="flex-1">
                <p class="font-semibold text-lg">{{ message.text }}</p>

                <div class="mt-2">
                    <div class="w-full bg-opacity-30 rounded-full h-1 overflow-hidden"
                       >
                        <div class="h-1 rounded-full transition-all duration-100 ease-linear"
                            [class.progress-animation]="isMessageVisible" 
                            [class.bg-white]="message.type === 'success'"
                            [class.bg-gray-100]="message.type === 'error'" 
                            [style.width.%]="progressPercentage()"
                            (animationend)="onAnimationComplete()"></div>
                    </div>
                </div>

                <div class="mt-3">
                    <div class="w-full bg-emerald-200 rounded-full h-3 overflow-hidden">
                        <div [class.bg-white]="message.type === 'success'" [class.bg-red-600]="message.type === 'error'"
                            [class.progress-animation]="isMessageVisible" (animationend)="onAnimationComplete()"
                            class="bg-gradient-to-r from-emerald-500 to-emerald-700 h-3 rounded-full"
                            style="width: 100%"></div>
                    </div>
                </div>


            </div>
            <button (click)="dismiss()" class="opacity-70 hover:opacity-100">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
        </div>
    </div>
</div>
}
