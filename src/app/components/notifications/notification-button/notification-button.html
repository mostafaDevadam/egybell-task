<div class="relative inline-block" #buttonContainer>
      <!-- Connection Status Indicator -->
      @if (!store.isConnected()) {
        <div class="absolute -top-1 -right-1 w-3 h-3 bg-yellow-500 rounded-full animate-pulse" 
             title="Connecting..."></div>
      }
      
      <!-- Notification Trigger Button -->
      <button
        (click)="onClick()"
        class="relative bg-transparent border-none cursor-pointer p-2 rounded-full transition-all duration-300 hover:bg-gray-100 dark:hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-gray-900"
        [attr.aria-label]="'Notifications'"
        [attr.aria-expanded]="isOpen">
        
        <!-- Bell Icon -->
        <svg 
          xmlns="http://www.w3.org/2000/svg" 
          class="h-5 w-5 text-gray-600 dark:text-gray-300 transition-transform duration-200"
          fill="none" 
          viewBox="0 0 24 24" 
          stroke="currentColor">
          <path 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            stroke-width="2" 
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
        
        <!-- Animated Unread Badge -->
         <!-- 
        @if (store.getUnreadCount() > 0) {
          <div 
            class="absolute -top-1 -right-1 min-w-[20px] h-5 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center px-1.5 shadow-lg animate-bounce">
            <span>{{ store.getUnreadCount() > 99 ? '99+' : store.getUnreadCount() }}</span>
          </div>
        }-->
        
        <!-- Ripple Effect -->
        @if (isRippling()) {
          <span class="absolute inset-0 rounded-full animate-ping bg-blue-400"></span>
        }
      </button>
      
     
     
    </div>
